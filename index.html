<script>
(function () {
  "use strict";
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const pad = (n) => String(n).padStart(2, "0");
  const isoOf = (y, m, d) => y + "-" + pad(m + 1) + "-" + pad(d);           // m is 0-based
  const todayISO = () => { const t = new Date(); return isoOf(t.getFullYear(), t.getMonth(), t.getDate()); };
  const dayNum = (y, m, d) => Math.round(Date.UTC(y, m, d) / 864e5);
  const fromDayNum = (n) => { const t = new Date(n * 864e5); return { y: t.getUTCFullYear(), m: t.getUTCMonth(), d: t.getUTCDate() }; };
  const daysIn = (y, m) => new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  const parseISO = (s) => { const [y, m, d] = s.split("-").map(Number); return { y, m: m - 1, d }; };
  const niceDate = (iso) => { const p = parseISO(iso); const w = new Date(Date.UTC(p.y, p.m, p.d)).getUTCDay(); return DOW[w] + ", " + MONTHS[p.m].slice(0, 3) + " " + p.d; };
  const fmt = (v) => { const n = Math.abs(v); const s = Number.isInteger(+n.toFixed(2)) ? n.toLocaleString("en-CA", { maximumFractionDigits: 0 }) : n.toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); return (v < 0 ? "−$" : "$") + s; };

  const state = { items: [], pay: new Map(), y: new Date().getFullYear(), m: new Date().getMonth(), manage: false, adding: false, ready: true, mode: "saved", note: "", budgets: {}, activeId: null, panel: false, pending: null, renaming: null, importText: "", sharing: false, importOpen: false, drawer: false, tab: "overview", billFilter: "all", spendFilter: "all", billView: "list", overdueCount: 0, themeOpen: false, easy: false, easyTab: "home", easyForm: null, easyConfirm: null, easyMonth: 0, cash: null, cashOpen: false, checkOpen: false, loans: [], loanEdit: null, loanPay: null, ovCard: 0, billQuery: "", bill: null, billEdit: false, billList: null };
  let itemsCol = null, payCol = null;

  /* ---------- storage: this device's localStorage, one entry holding every budget ---------- */
  const APP_VERSION = "33";                                        // keep equal to the number in sw.js (CACHE = "tapbudget-v33")
  const KEY = "budget-tracker:v2", OLD_KEY = "budget-tracker:v1";
  const TYPES = ["income", "bill", "variable"];
  const ISO = /^\d{4}-\d{2}-\d{2}$/;
  const uid = () => "b" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const slug = (s) => (String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "budget").slice(0, 40);
  const curName = () => (state.budgets[state.activeId] || {}).name || "My budget";
  function loadActive() {
    const b = state.budgets[state.activeId];
    state.items = Array.isArray(b.items) ? b.items : [];
    state.pay = new Map(Object.entries(b.pay || {}));
    state.loans = Array.isArray(b.loans) ? b.loans : []; state.cash = cleanCash(b.cash) || defaultCash(); state.loanEdit = null; state.loanPay = null;
  }
  function load() {
    let fresh = false, seeded = false, added = false;
    try {
      let d = null;
      const raw = localStorage.getItem(KEY);
      if (raw) d = JSON.parse(raw);
      else {
        fresh = true;
        const old = localStorage.getItem(OLD_KEY);           // single-budget version: carry it over
        if (old) { fresh = false; const o = JSON.parse(old), id = uid(); d = { active: id, budgets: { [id]: { name: "My budget", items: o.items || [], pay: o.pay || {} } } }; }
      }
      if (d && d.budgets && Object.keys(d.budgets).length) { state.budgets = d.budgets; state.activeId = d.budgets[d.active] ? d.active : Object.keys(d.budgets)[0]; seeded = !!d.seeded; }
    } catch (e) { state.mode = "local"; }
    if (!state.activeId || !state.budgets[state.activeId]) { state.budgets = {}; state.activeId = uid(); state.budgets[state.activeId] = fresh ? (() => { const it = sampleItems(); return { name: "Example budget", items: it, pay: samplePay(it), loans: sampleLoans(), cash: sampleCash(), sample: true }; })() : { name: "My budget", items: [], pay: {} }; }
    if (!fresh && !seeded) { state.budgets[uid()] = exampleBudget(); added = true; }     // existing installs get the example once, so it shows in the list
    for (const b of Object.values(state.budgets)) if (b.sample) { const have = new Set((b.loans || []).map((l) => l.id)); for (const l of sampleLoans()) { if (!have.has(l.id)) { b.loans = (b.loans || []).concat([l]); added = true; } else if (l.kind === "card") { const cur = b.loans.find((x) => x.id === l.id); if (cur && !(cur.payment > 0)) { cur.payment = l.payment; added = true; } } } }
    for (const b of Object.values(state.budgets)) if (b.sample && !b.cash) { b.cash = sampleCash(); added = true; }       // example budgets that predate the cash flow card
    loadActive();
    if (fresh || added) persist();      // keep the example stable from the first visit
  }
  function persist() {
    const b = state.budgets[state.activeId];
    b.items = state.items; b.pay = Object.fromEntries(state.pay); b.loans = state.loans; b.cash = state.cash;
    if (state.mode === "local") return;
    try { localStorage.setItem(KEY, JSON.stringify({ version: 2, active: state.activeId, budgets: state.budgets, seeded: true })); }
    catch (e) { state.mode = "local"; }
  }
  function switchTo(id) { if (!state.budgets[id]) return; persist(); state.activeId = id; loadActive(); state.manage = false; state.adding = false; state.panel = false; state.renaming = null; state.note = ""; persist(); render(); }
  function deleteBudget(id) {
    persist(); delete state.budgets[id];
    if (!Object.keys(state.budgets).length) state.budgets[uid()] = { name: "My budget", items: [], pay: {} };
    if (!state.budgets[state.activeId]) state.activeId = Object.keys(state.budgets)[0];
    loadActive(); persist(); render();
  }
  const upsert = (arr, it) => { const i = arr.findIndex((x) => x.id === it.id); if (i >= 0) arr[i] = it; else arr.push(it); };
  const store = {
    setItem(it) { state.budgets[state.activeId].sample = false; upsert(state.items, it); persist(); render(); },
    delItem(id) { state.budgets[state.activeId].sample = false; const keep = state.loans.filter(isLinked).map((l) => ({ id: l.id, cur: debtNow(l) })); state.items = state.items.filter((x) => x.id !== id); for (const [k, v] of Array.from(state.pay)) if (v.item === id) state.pay.delete(k); state.loans = state.loans.map((l) => { const k = keep.find((z) => z.id === l.id); if (!k) return l; const { payBill, ...rest } = l; return rebase(payBill === id ? rest : l, k.cur); }); persist(); render(); },
    setPay(key, p) { state.pay.set(key, p); persist(); render(); },
    delPay(key) { state.pay.delete(key); persist(); render(); },
    setLoan(l) { state.budgets[state.activeId].sample = false; upsert(state.loans, l); persist(); render(); },
    delLoan(id) { state.budgets[state.activeId].sample = false; state.loans = state.loans.filter((x) => x.id !== id); persist(); render(); }
  };

  /* ---------- backup and restore (one file per budget) ---------- */
  const num = (v) => (typeof v === "number" && isFinite(v) ? v : null);
  const str = (v, max) => (typeof v === "string" ? v.slice(0, max) : "");
  function cleanItem(x) {
    if (!x || typeof x.id !== "string" || !x.id || !TYPES.includes(x.type) || num(x.amount) == null || x.amount < 0) return null;
    const it = { id: str(x.id, 80), name: str(x.name, 60) || "Untitled", type: x.type, amount: x.amount, account: str(x.account, 40), order: num(x.order) || 0, freq: x.freq === "biweekly" ? "biweekly" : "monthly" };
    if (it.freq === "biweekly") { if (!ISO.test(x.anchor || "")) return null; it.anchor = x.anchor; }
    else if (it.type !== "variable") it.day = Math.min(31, Math.max(1, Math.round(num(x.day) || 1)));
    else { const dd = num(x.day); if (dd != null && dd >= 1 && dd <= 31) it.day = Math.round(dd); }          // optional for everyday spending
    if (x.recurring === true && it.type !== "variable") { it.recurring = true; it.autoSince = ISO.test(x.autoSince || "") ? x.autoSince : todayISO(); }
    return it;
  }
  function cleanLoan(x) {
    if (!x || typeof x.id !== "string" || !x.id) return null;
    const total = num(x.total), balance = num(x.balance), payment = num(x.payment);
    if (total == null || total < 0 || balance == null || balance < 0) return null;
    const card = x.kind === "card";
    const out = { id: str(x.id, 80), name: str(x.name, 60) || (card ? "Credit card" : "Loan"), kind: card ? "card" : "loan", total, balance, payment: payment == null || payment < 0 ? 0 : payment };
    if (typeof x.payBill === "string" && x.payBill) out.payBill = str(x.payBill, 120);
    if (card && Array.isArray(x.accounts)) { const a = x.accounts.filter((v) => typeof v === "string" && v.trim()).slice(0, 8).map((v) => str(v, 40)); if (a.length) out.accounts = a; }
    const apr = num(x.apr); if (!card && apr != null && apr > 0 && apr <= 100) out.apr = apr;
    if ((out.payBill || out.accounts) && typeof x.asOf === "string" && ISO.test(x.asOf)) { out.asOf = x.asOf; if (Array.isArray(x.seen)) out.seen = x.seen.filter((v) => typeof v === "string").slice(0, 600).map((v) => str(v, 140)); }
    return out;
  }
  function cleanPay(raw, items) {
    const out = {};
    for (const [k, v] of Object.entries(raw || {})) {
      if (v && typeof v.item === "string" && items.some((i) => i.id === v.item)) out[String(k).slice(0, 120)] = { item: v.item, due: ISO.test(v.due || "") ? v.due : null, on: ISO.test(v.on || "") ? v.on : todayISO(), amt: num(v.amt) ?? 0 };
    }
    return out;
  }
  async function backup() {
    persist();
    const name = curName();
    const data = JSON.stringify({ app: "budget-tracker", version: 2, name, items: state.items, pay: Object.fromEntries(state.pay), loans: state.loans, cash: state.cash }, null, 2);
    const fileName = "budget-" + slug(name) + "-" + todayISO() + ".json";
    const file = new File([data], fileName, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name + " budget backup" }); return; } catch (e) { if (e && e.name === "AbortError") return; }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = fileName; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  async function stageRestore(file) {
    try { stageData(JSON.parse(await file.text()), file.name); }
    catch (e) { state.pending = null; state.note = "That file couldn’t be read as a budget backup."; render(); }
  }
  function stageData(d, fileName) {
    try {
      const items = (Array.isArray(d.items) ? d.items : []).map(cleanItem).filter(Boolean);
      const loans = Array.isArray(d.loans) ? d.loans.map(cleanLoan).filter(Boolean) : null;
      if (!items.length && !(loans && loans.length)) throw new Error("no items");
      const fromFile = String(fileName || "").replace(/\.json$/i, "").replace(/^budget-/, "").replace(/-\d{4}-\d{2}-\d{2}$/, "").replace(/[-_]+/g, " ").trim().replace(/\b\w/g, (c) => c.toUpperCase());
      const name = str(d.name, 60).trim() || fromFile || "Imported budget";
      state.pending = { name, items, pay: cleanPay(d.pay, items), loans, cash: d.cash ? cleanCash(d.cash) : null, fileName: fileName || "pasted text" };
      if (state.easy) { state.easy = false; document.documentElement.removeAttribute("data-easy"); }      // the import prompt lives in the full app
      state.note = ""; state.panel = false; state.importOpen = false; state.sharing = false; render();
      const rh = document.getElementById("restoreHost"); if (rh && rh.scrollIntoView) rh.scrollIntoView({ block: "nearest" });
    } catch (e) { state.pending = null; state.note = "That doesn’t look like a budget link or backup."; render(); }
  }

  /* ---------- move a budget without files: link or text ---------- */
  const b64u = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
  const unb64u = (t) => { t = t.replace(/-/g, "+").replace(/_/g, "/"); while (t.length % 4) t += "="; const s = atob(t), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
  async function pipe(Stream, kind, bytes) { const s = new Stream(kind), w = s.writable.getWriter(); w.write(bytes); w.close(); return new Uint8Array(await new Response(s.readable).arrayBuffer()); }
  async function toToken(obj) {
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    if (typeof CompressionStream !== "undefined") { try { return "z." + b64u(await pipe(CompressionStream, "deflate-raw", bytes)); } catch (e) { /* fall through */ } }
    return "u." + b64u(bytes);
  }
  async function fromToken(tok) {
    const kind = tok.slice(0, 1), bytes = unb64u(tok.slice(2));
    if (kind === "z") {
      if (typeof DecompressionStream === "undefined") throw new Error("needs newer browser");
      return JSON.parse(new TextDecoder().decode(await pipe(DecompressionStream, "deflate-raw", bytes)));
    }
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function payload(withHistory) {
    persist();
    return { app: "budget-tracker", version: 2, name: curName(), items: state.items, pay: withHistory ? Object.fromEntries(state.pay) : {}, loans: withHistory ? state.loans : state.loans.map(({ asOf, seen, ...rest }) => rest), ...(withHistory ? { cash: state.cash } : {}) };
  }
  async function makeLink(withHistory) { return location.href.split("#")[0] + "#b=" + await toToken(payload(withHistory)); }
  async function importText(text) {
    let t = String(text || "").trim();
    if (t[0] === '"' && t[t.length - 1] === '"' && t.includes('""')) t = t.slice(1, -1).replace(/""/g, '"');     // Excel wraps copied text in quotes and doubles the inner ones
    if (!t) { state.note = "Paste a budget link or backup text first."; render(); return; }
    try {
      let d;
      const hit = t.match(/[#?&]b=([uz]\.[A-Za-z0-9_-]+)/) || t.match(/^([uz]\.[A-Za-z0-9_-]+)$/);
      if (hit) d = await fromToken(hit[1]);
      else if (t[0] === "{") { try { d = JSON.parse(t); } catch (e) { d = JSON.parse(t.replace(/[\u201C\u201D]/g, '"')); } }     // also accepts curly quotes some apps swap in
      else throw new Error("unrecognised");
      state.importText = ""; stageData(d, "");
    } catch (e) { state.note = /newer/.test(e.message) ? "This link needs iOS 16.4 or newer to open." : "That doesn’t look like a budget link or backup."; render(); }
  }
  async function copyText(text, okMsg) {
    try { await navigator.clipboard.writeText(text); state.note = okMsg; }
    catch (e) { state.note = "Couldn’t copy automatically. Try Share instead."; }
    render();
  }
  async function shareLink(withHistory) {
    const link = await makeLink(withHistory);
    if (navigator.share) { try { await navigator.share({ title: curName() + " budget", text: "TapBudget: " + curName(), url: link }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
    copyText(link, "Link copied. Paste it into the app on your other device.");
  }

  function applyRestore(target, newName, mode) {
    const p = state.pending; if (!p) return;
    persist();
    let id, label;
    if (target === "new") {
      id = uid(); label = newName.trim() || p.name;
      const samples = Object.keys(state.budgets).filter((k) => state.budgets[k].sample);
      if (samples.length === 1 && Object.keys(state.budgets).length === 1) delete state.budgets[samples[0]];     // a lone, untouched example makes way
      const taken = Object.values(state.budgets).map((b) => b.name.toLowerCase());
      if (taken.includes(label.toLowerCase())) { let n = 2; while (taken.includes((label + " (" + n + ")").toLowerCase())) n++; label += " (" + n + ")"; }
      state.budgets[id] = { name: label, items: p.items, pay: p.pay, loans: p.loans || [], ...(p.cash ? { cash: p.cash } : {}) };
    } else {
      id = target; const b = state.budgets[id]; label = b.name;
      if (mode === "merge") {
        const map = new Map((b.items || []).map((i) => [i.id, i]));
        for (const i of p.items) map.set(i.id, i);
        b.items = Array.from(map.values()); b.pay = { ...(b.pay || {}), ...p.pay };
        if (p.loans) { const lm = new Map((b.loans || []).map((l) => [l.id, l])); for (const l of p.loans) lm.set(l.id, l); b.loans = Array.from(lm.values()); }
        if (p.cash) { const old = cleanCash(b.cash) || defaultCash(); b.cash = { starts: { ...old.starts, ...p.cash.starts }, warn: p.cash.warn, carry: p.cash.carry, follow: p.cash.follow, spend: p.cash.spend, actuals: cleanActuals([...old.actuals, ...p.cash.actuals]) }; }
      } else { b.items = p.items; b.pay = p.pay; if (p.loans) b.loans = p.loans; if (p.cash) b.cash = p.cash; }
    }
    state.activeId = id; loadActive();
    state.pending = null; state.panel = false; state.manage = false; state.adding = false;
    state.note = "Restored into “" + label + "” (" + state.items.length + " items).";
    persist(); render();
  }
  function exampleBudget() { const it = sampleItems(); return { name: "Example budget", items: it, pay: samplePay(it), loans: sampleLoans(), cash: sampleCash(), sample: true }; }
  function addExample(open) {
    persist();
    const existing = Object.keys(state.budgets).find((k) => state.budgets[k].sample);
    let id = existing;

/* ---------- colours people can change ---------- */
  const INK = "#1f2933", COLORS_KEY = "budget-tracker:colors", COLORS_CSS_KEY = "budget-tracker:colorsCss";
  const PRESETS = [
    { id: "cyan", name: "Cyan & Yellow", brand: "#2ebfd9", primary: "#0e7c91", accent: "#fdcb2f" },
    { id: "ocean", name: "Ocean", brand: "#5ba8f5", primary: "#1d5fae", accent: "#ffb547" },
    { id: "forest", name: "Forest", brand: "#6fcf97", primary: "#1f7a4d", accent: "#f2c94c" },
    { id: "sunset", name: "Sunset", brand: "#ff9f6b", primary: "#b8431c", accent: "#ffd166" },
    { id: "berry", name: "Berry", brand: "#e58bc0", primary: "#9b2c6f", accent: "#ffd84d" },
    { id: "graphite", name: "Graphite", brand: "#a8b3bd", primary: "#374151", accent: "#facc15" }
  ];
  const rgbOf = (hex) => { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const hexOf = (rgb) => "#" + rgb.map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");

  const contrastOf = (a, b) => { const x = lumOf(a), y = lumOf(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const mixHex = (a, b, t) => { const x = rgbOf(a), y = rgbOf(b); return hexOf(x.map((v, i) => v + (y[i] - v) * t)); };
  function readable(bg) {                                          // nudge a dark-mode color until its text reaches 4.5:1
    let c = bg;
    for (let i = 0; i < 20; i++) { const fg = contrastOf(c, "#ffffff") >= contrastOf(c, INK) ? "#ffffff" : INK; if (contrastOf(c, fg) >= 4.5) return c; c = mixHex(c, fg === INK ? "#ffffff" : "#000000", 0.06); }
    return c;
  }
  const fgFor = (bg) => (contrastOf(bg, "#ffffff") >= contrastOf(bg, INK) ? "#ffffff" : INK);
  const isHex = (v) => typeof v === "string" && /^#[0-9a-fA-F]{6}$/.test(v);
  function getColors() {
    try { const c = JSON.parse(localStorage.getItem(COLORS_KEY) || "null"); if (c && isHex(c.brand) && isHex(c.primary) && isHex(c.accent)) return c; } catch (e) { /* use the default */ }

  }
  function colorsCss(c) {
    const dkBrand = readable(mixHex(c.brand, "#000000", 0.12)), dkPrimary = readable(lumOf(c.primary) < 0.2 ? mixHex(c.primary, "#ffffff", 0.4) : c.primary);
    const light = "--brand:" + c.brand + ";--on-brand:" + fgFor(c.brand) + ";--primary:" + c.primary + ";--primary-fg:" + fgFor(c.primary) + ";--accent:" + c.accent + ";--accent-fg:" + fgFor(c.accent) + ";--info:" + c.brand + ";--info-soft:" + mixHex(c.brand, "#ffffff", 0.62) + ";";
    const dark = "--brand:" + dkBrand + ";--on-brand:" + fgFor(dkBrand) + ";--primary:" + dkPrimary + ";--primary-fg:" + fgFor(dkPrimary) + ";--accent:" + c.accent + ";--accent-fg:" + fgFor(c.accent) + ";--info:" + dkBrand + ";--info-soft:" + mixHex(dkBrand, "#111214", 0.6) + ";";

  /* ---------- wallpaper: a picture of your own behind the app. The picture is kept in this browser's
     IndexedDB (so it never crowds out your budgets in localStorage); only the on/dim/blur settings live in localStorage.
     It is never added to share links or backup files. ---------- */
  const WALL_KEY = "budget-tracker:wall", WALL_LEGACY = "wallpaper", WALL_MAX = 2200;   // longest side kept, in pixels
  const numIn = (v, lo, hi, d) => (typeof v === "number" && isFinite(v) ? Math.min(hi, Math.max(lo, Math.round(v))) : d);
  function getWall() {
    try { const w = JSON.parse(localStorage.getItem(WALL_KEY) || "null"); if (w && typeof w === "object") return { on: !!w.on, dim: numIn(w.dim, 0, 80, 30), blur: numIn(w.blur, 0, 100, 0), id: typeof w.id === "string" && w.id ? w.id.slice(0, 40) : WALL_LEGACY }; } catch (e) { /* use the default */ }

  }

  function idbRun(mode, job) {                                     // one small store, opened per call
    return new Promise((res, rej) => {

      rq.onupgradeneeded = () => rq.result.createObjectStore("files");
      rq.onerror = () => rej(rq.error || new Error("storage unavailable"));
      rq.onsuccess = () => {
        const db = rq.result, tx = db.transaction("files", mode), r = job(tx.objectStore("files"));
        tx.oncomplete = () => { db.close(); res(r && "result" in r ? r.result : undefined); };
        tx.onerror = tx.onabort = () => { db.close(); rej(tx.error || new Error("storage failed")); };

  }
  let wallUrl = null, wallMsg = "", wallBad = false, wallSaving = null;   // wallSaving: a picture being saved right now, so tidying never deletes it
  function showWall(blob) {
    const el = $("wall"); if (wallUrl) URL.revokeObjectURL(wallUrl);
    wallUrl = blob ? URL.createObjectURL(blob) : null;
    el.style.backgroundImage = wallUrl ? 'url("' + wallUrl + '")' : ""; el.classList.toggle("ready", !!wallUrl);
  }
  async function loadWall() {
    const w = getWall(), forId = state.activeId;
    if (!w.on || !w.id) { showWall(null); return; }
    try {
      const blob = await idbRun("readonly", (st) => st.get(w.id));
      const now = getWall(); if (state.activeId !== forId || !now.on || now.id !== w.id) return;   // switched budgets while it loaded
      if (blob) { showWall(blob); if (state.themeOpen) render(); } else { saveWall({ ...now, on: false, id: null }); rememberLook(); showWall(null); }
    } catch (e) { /* the page color shows instead */ }
  }
  const fileToImage = (file) => new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error("decode")); }; im.src = u; });
  async function pickWall(file) {
    if (!file) return;
    if (file.type && !/^image\//.test(file.type)) { wallMsg = "That file isn’t a picture. Choose a photo or image."; wallBad = true; render(); return; }
    wallMsg = "Getting your picture ready…"; wallBad = false; render();
    let step = "open";
    try {
      const im = await fileToImage(file), k = Math.min(1, WALL_MAX / Math.max(im.naturalWidth, im.naturalHeight));   // shrink big photos so they load fast
      const cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(im.naturalWidth * k)); cv.height = Math.max(1, Math.round(im.naturalHeight * k));
      const g = cv.getContext("2d"); g.fillStyle = "#ffffff"; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(im, 0, 0, cv.width, cv.height);
      const blob = await new Promise((res, rej) => cv.toBlob((b) => (b ? res(b) : rej(new Error("encode"))), "image/jpeg", 0.84));
      const id = "wall-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      step = "save"; wallSaving = id; await idbRun("readwrite", (st) => st.put(blob, id));
      showWall(blob); saveWall({ ...getWall(), on: true, id }); rememberLook(); wallSaving = null; tidyWalls();
      wallMsg = ""; state.note = "Wallpaper set for “" + curName() + "”. It stays on this device."; render();
    } catch (e) {
      wallSaving = null; wallBad = true; wallMsg = step === "save" ? "This browser couldn’t save the picture. Try a smaller one, or check that there is free space." : "That picture couldn’t be opened. Try a JPEG or PNG.";

  }
  async function removeWall() {

    const b = $("wallChoose"); if (b) b.focus({ preventScroll: true });
  }
  function wallPanel() {

  /* ---------- each budget keeps its own look: wallpaper, colors, and Flat or Glass. Light, Dark or Auto stays the same for the whole app.
     The settings above always hold the open budget's look (the start-up script reads them before the first frame);
     this map remembers every budget's look, so switching budgets switches it back. It lives on this device only. ---------- */
  const LOOKS_KEY = "budget-tracker:looks";
  const currentLook = () => ({ colors: getColors(), look: getLook(), wall: getWall(), sw: getSw() });
  function getLooks() { try { const m = JSON.parse(localStorage.getItem(LOOKS_KEY) || "{}"); return m && typeof m === "object" && !Array.isArray(m) ? m : {}; } catch (e) { return {}; } }

      const keys = await idbRun("readonly", (st) => st.getAllKeys());
      const gone = (keys || []).filter((k) => !used.has(k));
      if (gone.length) await idbRun("readwrite", (st) => { gone.forEach((k) => st.delete(k)); });

    writeLook(e.look === "glass" ? "glass" : "flat");
    writeSw(swOk(e.sw));

    const wall = { on: !!w.on && typeof w.id === "string", dim: numIn(w.dim, 0, 80, 30), blur: numIn(w.blur, 0, 100, 0), id: w.on && typeof w.id === "string" ? w.id : null };

    if (changed) { putLooks(m); tidyWalls(); }

  }

  function renderThemeSheet() {

    const note = (hex) => { const best = Math.max(contrastOf(hex, "#ffffff"), contrastOf(hex, INK)); return best >= 4.5 ? ["Text on this color is easy to read.", false] : ["Text on this color is hard to read. Try a darker or lighter shade.", true]; };

      return h("div", { class: "crow" }, h("label", { for: "c-" + key }, label, h("small", {}, hint)), h("div", { style: "display:flex;align-items:center;gap:10px" }, code, inp), nt);
    });

    const lookPanel = h("div", { class: "panel" }, h("h3", {}, "Look"),
      h("p", { class: "sub" }, "Glass makes the month bar, tab bar, menu and sheets see-through and blurred. Flat keeps them solid. It changes straight away."),
      h("div", { class: "seg", role: "group", "aria-label": "Style", style: "margin:12px 0 0" }, [["flat", "Flat"], ["glass", "Glass"]].map(([v, l]) => h("button", { "aria-pressed": String(look === v), onclick: () => { setLook(v); const b = document.querySelector('#themeHost .seg button[aria-pressed="true"]'); if (b) b.focus({ preventScroll: true }); } }, l))),

    const about = h("p", { class: "babout" }, freq + ". " + (inc ? "Expected" : "Planned") + " at " + fmt(it.amount) + "." + (paid && p.amt != null && p.amt !== it.amount ? " This time it was " + fmt(p.amt) + "." : "") + (auto ? " This one is automatic. Change that in Settings." : ""));
    const list = state.billList.map((k) => all.find((x) => x.key === k)).filter(Boolean), tints = ["var(--brand)", "var(--accent)", "var(--primary)"];
    const seeAll = h("button", { class: "linkbtn", onclick: () => { state.billFilter = "unpaid"; state.billView = "list"; state.billQuery = ""; const qi = $("billQuery"); if (qi) qi.value = ""; state.bill = null; state.billList = null; setTab("bills"); } }, "See all");
    const sheet = h("div", { class: "bsheet" }, h("div", { class: "grab", "aria-hidden": "true" }),
      h("div", { class: "btitle" }, h("h2", { id: "billTitle" }, it.name), h("span", { class: "statpill" }, h("span", { class: "dot " + stDot, "aria-hidden": "true" }), stText)),
      h("div", { class: "bsub" }, h("span", { class: "acct" }, ico("wallet"), it.account || "No account set"), h("span", {}, inc ? "Money in" : "Bill")),
      paybox, about,
      state.billEdit ? h("div", { class: "editbox" }, h("h3", {}, "Edit item"), manageControls(it)) : null,
      h("div", { class: "secthead" }, h("h3", {}, "Coming up"), list.length ? seeAll : null),
      list.length ? h("div", { class: "carousel", role: "region", "aria-label": "Coming up this month", tabindex: "0" }, list.map((x, i) => ccard(x, c, tints[i % 3])))

    host.replaceChildren(hero, sheet); host.hidden = false; page.inert = true; bar.inert = true; billShownKey = o.key; syncNoScroll();
    host.scrollTop = top; const car = host.querySelector(".carousel"); if (car) car.scrollLeft = carLeft;
    if (fid) { const el = host.querySelector('[data-f="' + cssEsc(fid) + '"]'); if (el) el.focus({ preventScroll: true }); }

  /* ---------- add item ---------- */
  function renderAdd() {

    f.day = h("input", { type: "number", min: "1", max: "31", placeholder: "1–31" });

    const typeHint = h("p", { class: "sub typehint" }), TYPE_HINTS = { bill: "A payment with a due date. Tick it when you pay it.", income: "Money coming in, like a paycheck. Tick it when it arrives.", variable: "A monthly budget you spend from, like groceries. Type what you have spent as you go. If it also has a date, add the day and the cash flow shows it on that date. Without a day, it is spread through the month." };

      typeHint, err, h("div", { class: "actions" }, save, h("button", { class: "btn", onclick: () => { state.adding = false; render(); } }, "Cancel"))));
    sync();
  }

  /* ---------- controls ---------- */
  const step = (n) => { let m = state.m + n, y = state.y; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } state.m = m; state.y = y; render(); };
  $("menuBtn").addEventListener("click", () => setDrawer(!state.drawer));
  $("scrim").addEventListener("click", () => setDrawer(false));
  $("appAdd").addEventListener("click", () => openSheet("add"));
  $("sheetClose").addEventListener("click", closeSheet);
  $("sheetWrap").addEventListener("click", (e) => { if (e.target === $("sheetWrap")) closeSheet(); });
  document.addEventListener("keydown", (e) => { if (e.key !== "Escape") return; if (state.drawer) setDrawer(false); else if (!$("sheetWrap").hidden) closeSheet(); else if (state.bill) closeBill(); });
  /* swipe the menu in from the left edge (it follows your finger), and swipe it back to close.
     On a bill's details the same edge swipe goes back, the way it does in iPhone apps. */
  const EDGE = 28, drawerEl = $("drawer"), scrimEl = $("scrim");
  let drag = null;
  const closedX = () => -(drawerEl.offsetWidth + 32);
  function dragTo(x) {
    const cx = closedX(), progress = Math.max(0, Math.min(1, 1 - x / cx));
    drawerEl.style.transition = "none"; drawerEl.style.transform = "translateX(" + x + "px)";
    scrimEl.style.transition = "none"; scrimEl.style.opacity = String(progress);
    return progress;
  }
  document.addEventListener("touchstart", (e) => {
    drag = null; if (state.easy) return;
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    if (state.bill) { if (t.clientX <= EDGE && $("sheetWrap").hidden) drag = { mode: "back", x0: t.clientX, y0: t.clientY, t0: Date.now(), lock: null, dx: 0, x: 0 }; return; }
    if (state.drawer) { if (drawerEl.contains(e.target) || e.target === scrimEl) drag = { mode: "close", x0: t.clientX, y0: t.clientY, t0: Date.now(), lock: null, dx: 0, x: 0 }; }
    else if (t.clientX <= EDGE && $("sheetWrap").hidden) drag = { mode: "open", x0: t.clientX, y0: t.clientY, t0: Date.now(), lock: null, dx: 0, x: closedX() };
  }, { passive: true });
  document.addEventListener("touchmove", (e) => {
    if (!drag) return;
    const t = e.touches[0], dx = t.clientX - drag.x0, dy = t.clientY - drag.y0;
    if (drag.lock === null) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      drag.lock = Math.abs(dx) > Math.abs(dy) * 1.2 ? "x" : "y";
      if (drag.lock === "x" && drag.mode === "open") { drawerEl.style.visibility = "visible"; drawerEl.inert = false; }
    }
    if (drag.lock !== "x") return;
    if (e.cancelable) e.preventDefault();
    if (drag.mode === "back") { const el = $("billScreen"); drag.dx = dx; drag.x = Math.max(0, dx); el.style.transition = "none"; el.style.transform = "translateX(" + drag.x + "px)"; return; }
    const cx = closedX(); drag.dx = dx;
    drag.x = drag.mode === "open" ? Math.min(0, Math.max(cx, cx + dx)) : Math.min(0, Math.max(cx, dx));
    dragTo(drag.x);
  }, { passive: false });
  const endDrag = () => {
    if (!drag) return;
    const d0 = drag; drag = null;
    if (d0.lock !== "x") return;
    if (d0.mode === "back") {
      const el = $("billScreen"), w = el.offsetWidth || 1, sp = d0.dx / Math.max(1, Date.now() - d0.t0), go = d0.x > w * 0.33 || sp > 0.5;
      el.style.transition = "transform .2s ease"; el.style.transform = go ? "translateX(100%)" : "";
      setTimeout(() => { el.style.transition = ""; if (go) { el.style.transform = ""; closeBill(); } }, 200);
      return;
    }
    const progress = 1 - d0.x / closedX(), speed = d0.dx / Math.max(1, Date.now() - d0.t0);      // pixels per millisecond
    const open = d0.mode === "open" ? (progress > 0.35 || speed > 0.5) : !(progress < 0.65 || speed < -0.5);
    for (const p of ["transition", "transform", "visibility"]) drawerEl.style[p] = "";
    scrimEl.style.transition = ""; scrimEl.style.opacity = "";
    setDrawer(open);
  };
  document.addEventListener("touchend", endDrag, { passive: true });
  document.addEventListener("touchcancel", endDrag, { passive: true });
  /* swipe the gauge cards: the front card follows your finger, the next one rises up behind it */
  const deckEl = $("deck"); let dk = null, dkMoved = false;
  deckEl.addEventListener("pointerdown", (e) => {
    if (!deckEl.children.length || (e.pointerType === "mouse" && e.button !== 0)) return;
    if (e.pointerType !== "mouse" && e.clientX <= EDGE) return;   // the left edge belongs to the menu
    dk = { id: e.pointerId, x0: e.clientX, y0: e.clientY, t0: performance.now(), lock: null, dx: 0 }; dkMoved = false;
  });
  deckEl.addEventListener("pointermove", (e) => {
    if (!dk || e.pointerId !== dk.id) return;
    const dx = e.clientX - dk.x0, dy = e.clientY - dk.y0;
    if (dk.lock === null) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      dk.lock = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
      if (dk.lock === "x") { try { deckEl.setPointerCapture(e.pointerId); } catch (er) { /* keep tracking without capture */ } deckEl.classList.add("dragging"); dkMoved = true; }
    }
    if (dk.lock !== "x") return;
    dk.dx = dx; layoutDeck(dx);
  });
  const deckEnd = (e) => {
    if (!dk || e.pointerId !== dk.id) return;
    const d = dk; dk = null; deckEl.classList.remove("dragging");
    if (d.lock !== "x") return;
    const front = deckEl.querySelector(".dcard.front"), w = (front && front.offsetWidth) || 300, v = d.dx / Math.max(1, performance.now() - d.t0);
    if (e.type === "pointerup" && (Math.abs(d.dx) > w * 0.22 || (Math.abs(v) > 0.45 && Math.abs(d.dx) > 24))) showGauge(state.ovCard - Math.sign(d.dx), true);
    else layoutDeck(0);
  };
  deckEl.addEventListener("pointerup", deckEnd); deckEl.addEventListener("pointercancel", deckEnd);
  deckEl.addEventListener("click", (e) => { if (dkMoved) { e.stopPropagation(); e.preventDefault(); dkMoved = false; } }, true);
  deckEl.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") { e.preventDefault(); showGauge(state.ovCard - 1, true); } else if (e.key === "ArrowRight") { e.preventDefault(); showGauge(state.ovCard + 1, true); } });
  buildSearch();
  $("wallFile").addEventListener("change", (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ""; if (f) pickWall(f); });
  document.getElementById("restoreFile").addEventListener("change", (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ""; if (f) stageRestore(f); });

  window.addEventListener("resize", refit); window.addEventListener("orientationchange", refit);
  let lastW = window.innerWidth;
  window.addEventListener("resize", () => { if (window.innerWidth !== lastW) { lastW = window.innerWidth; render(); } });

  /* ---------- start ---------- */
  document.addEventListener("gesturestart", (e) => e.preventDefault());      // iOS pinch-zoom, which would otherwise stick
  function measureChrome() {                                       // keeps jump-to-field scrolling clear of the pinned month bar
    const st = $("strip"); if (st && st.offsetHeight) document.documentElement.style.setProperty("--strip-h", st.offsetHeight + "px");
  }
  window.addEventListener("resize", measureChrome);
  if (window.ResizeObserver) { const ro = new ResizeObserver(measureChrome); ro.observe($("strip")); }
  state.easy = document.documentElement.hasAttribute("data-easy");
  applyTheme();
  applyLook();
  applySw();
  applyColors(getColors());
  applyWallVars(getWall());
  load();
  loadUI();
  render();
  setDrawer(false);
  const m = location.hash.match(/^#b=([uz]\.[A-Za-z0-9_-]+)$/);
  if (m) {
    history.replaceState(null, "", location.href.split("#")[0]);       // keep the data out of the address bar and history
    fromToken(m[1]).then((d) => { stageData(d, ""); const inApp = window.navigator.standalone || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches); if (!inApp && state.pending) { state.pending.hint = "Tip: on iPhone, links open in Safari, which keeps its own data. To use this in your home-screen app, copy the link, open the app, then tap Manage and Paste."; render(); } })
      .catch((e) => { state.note = /newer/.test(e.message) ? "This link needs iOS 16.4 or newer to open." : "That budget link couldn’t be read."; render(); });
  }
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
